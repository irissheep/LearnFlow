spring:
  application:
    name: learnflow-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/learnflow}
    username: ${DB_USERNAME:learnflow_app}
    password: ${DB_PASSWORD:}
  flyway:
    # 兼容之前只有 learning_task 表的教学库，从版本 0 开始补齐结构，不删除旧数据。
    baseline-on-migrate: true
    baseline-version: 0
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 500ms
      connect-timeout: 500ms
mybatis:
  configuration:
    map-underscore-to-camel-case: true
server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      timeout: 8h
      cookie:
        http-only: true
        same-site: lax
        secure: ${COOKIE_SECURE:false}
learnflow:
  cache-enabled: ${CACHE_ENABLED:false}
  ai:
    url: ${AI_SERVICE_URL:http://127.0.0.1:8000}
    token: ${AI_SERVICE_TOKEN:}
    worker-enabled: ${AI_WORKER_ENABLED:true}
